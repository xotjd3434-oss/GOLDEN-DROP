<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GOLDEN DROP 위스키 상세 정보">
  <title>WHISKY DETAILS | GOLDEN DROP</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/detail.css">
  <script type="module" src="./js/detail.js"></script>
</head>

<body class="detail-page">
  <header class="header">
    <nav class="container nav" aria-label="메인 메뉴">
      <a href="index.html" class="logo">GOLDEN DROP</a>
      <div class="gnb">
        <a href="index.html">HOME</a>
        <a href="whisky.html" aria-current="page">WHISKY</a>
        <a href="journal.html">JOURNAL</a>
        <a href="guide.html">GUIDE</a>
        <span id="account-nav">
          <a href="login.html">로그인</a>
        </span>
      </div>
    </nav>
  </header>
  <main class="container detail-main" aria-labelledby="detail-page-title">
    <nav class="collection-breadcrumb" aria-label="현재 위치">
      <a href="index.html">HOME</a>
      <span aria-hidden="true">/</span>
      <a href="whisky.html">WHISKY</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">DETAILS</span>
    </nav>
    <h1 id="detail-page-title" class="sub-title">WHISKY DETAILS</h1>
    <p id="detail-status" class="detail-status" role="status" aria-live="polite">위스키 정보를 불러오는 중...</p>
    <article id="detail-content" class="detail-content" hidden>
      <div id="detail-image" class="detail-image"></div>
      <div class="detail-info">
        <p id="detail-category" class="detail-category"></p>
        <h2 id="detail-title"></h2>
        <p id="detail-brand" class="detail-brand"></p>
        <p id="detail-price" class="detail-price"></p>
        <dl class="detail-specs">
          <div>
            <dt>분류</dt>
            <dd id="detail-category-value"></dd>
          </div>
          <div>
            <dt>용량</dt>
            <dd id="detail-volume"></dd>
          </div>
          <div>
            <dt>원산지</dt>
            <dd id="detail-origin"></dd>
          </div>
        </dl>
        <section class="detail-description" aria-labelledby="description-title">
          <h3 id="description-title">위스키 이야기</h3>
          <p id="detail-description"></p>
        </section>
        <div class="detail-actions">
          <div class="detail-cart-controls" role="group" aria-label="장바구니 수량 조절">
            <button id="cart-minus" type="button" aria-label="장바구니 수량 1개 줄이기">−</button>
            <span id="cart-quantity" aria-live="polite" aria-atomic="true">0개</span>
            <button id="cart-plus" type="button" aria-label="장바구니에 1개 추가">+</button>
          </div>
          <button id="wishlist-btn" class="detail-wishlist" type="button" aria-pressed="false">
            <span aria-hidden="true">♡</span>
            찜하기
          </button>
        </div>
        <p id="detail-action-status" class="detail-action-status" role="status" aria-live="polite"></p>
        <a class="detail-back-link" href="whisky.html">위스키 컬렉션으로 돌아가기</a>
      </div>
    </article>
  </main>
  <footer class="footer">
    <div class="container">
      <p>GOLDEN DROP</p>
      <p>당신의 취향에 깊이를 더하는 위스키 이야기.</p>
      <p>&copy; 2026 GOLDEN DROP. 포트폴리오용 위스키 소개 사이트입니다.</p>
    </div>
  </footer>
</body>

</html>
